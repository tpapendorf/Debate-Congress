services:
  - type: web
    name: debate-congress
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/congress.db
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
